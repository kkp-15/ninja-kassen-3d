<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   箱館戦争 3D俯瞰デモ v2
   単一HTML / Three.js r128 / フレームワーク・ビルド不要
   v2: 指揮官・兵力ラベル / 戦闘エフェクト / 箱館湾海戦
   ============================================================ */

var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- renderer / scene ---------- */
var stage = document.getElementById("stage");
var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
stage.appendChild(renderer.domElement);

var scene = new THREE.Scene();
scene.background = new THREE.Color("#93a3b4");
scene.fog = new THREE.FogExp2("#93a3b4", 0.0028);

var camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 1, 2200);
camera.position.set(30,170,260);
var camPos = camera.position.clone();
var camLook = new THREE.Vector3(30,0,0);

var hemi = new THREE.HemisphereLight(0xcfd8e3, 0x44423c, 0.95);
scene.add(hemi);
var sun = new THREE.DirectionalLight(0xfff2dd, 0.8);
sun.position.set(-90,160,60);
scene.add(sun);

/* ---------- 地形（渡島半島・様式化） ---------- */
function blob(x,z,cx,cz,rx,rz,h){
  var dx=(x-cx)/rx, dz=(z-cz)/rz;
  return h*Math.exp(-(dx*dx+dz*dz)*1.8);
}
function ridgeFn(x,z,ax,az,bx,bz,h,w){
  var vx=bx-ax, vz=bz-az;
  var L2=vx*vx+vz*vz;
  var t=((x-ax)*vx+(z-az)*vz)/L2;
  t=Math.max(0,Math.min(1,t));
  var px=ax+vx*t, pz=az+vz*t;
  var d2=(x-px)*(x-px)+(z-pz)*(z-pz);
  return h*Math.exp(-d2/(w*w));
}
function hash(x,z){
  var s=Math.sin(x*12.9898+z*78.233)*43758.5453;
  return s-Math.floor(s);
}
function terrainH(x,z){
  var h=-14;
  h+=blob(x,z,   0,  30, 170, 150, 26);  // 半島本体
  h+=blob(x,z,  45, -70,  95,  70, 20);  // 函館平野側
  h+=blob(x,z,-105, -95,  80,  60, 22);  // 松前方面
  h+=blob(x,z,-120, -20,  60,  80, 16);  // 江差・乙部沿岸
  h+=blob(x,z, -10,  50,  60,  55, 30);  // 内陸山地
  h+=blob(x,z,  55, -25,  35,  30, 22);  // 横津岳方面
  h+=blob(x,z, -60, -60,  30,  35, 14);  // 二股口の山塊
  h-=blob(x,z,  42,-108,  26,  20, 26);  // 函館湾
  h+=blob(x,z,  70,-128,  13,  11, 34);  // 函館山
  h+=ridgeFn(x,z, 70,-128, 66,-98, 5, 6);// 砂州
  h+=(hash(Math.floor(x*0.7),Math.floor(z*0.7))-0.5)*1.4;
  return h;
}

var SEG=140, SIZE=440;
var terrGeo = new THREE.PlaneGeometry(SIZE,SIZE,SEG,SEG);
terrGeo.rotateX(-Math.PI/2);
(function(){
  var pos=terrGeo.attributes.position;
  var colors=[];
  var cSand=new THREE.Color("#b3a585"), cLow=new THREE.Color("#75836a"),
      cFor=new THREE.Color("#5a6a57"), cRock=new THREE.Color("#7c8279"),
      cSnow=new THREE.Color("#e8ecec"), tmp=new THREE.Color();
  function bandColor(h,x,z){
    var c;
    if(h<1.2)      c=tmp.copy(cSand).lerp(cLow,Math.max(0,(h+2)/3.2));
    else if(h<8)   c=tmp.copy(cLow).lerp(cFor,(h-1.2)/6.8);
    else if(h<18)  c=tmp.copy(cFor).lerp(cRock,(h-8)/10);
    else if(h<25)  c=tmp.copy(cRock).lerp(cSnow,(h-18)/7);
    else           c=tmp.copy(cSnow);
    var n=(hash(x*1.3,z*1.3)-0.5)*0.05;
    return [c.r+n,c.g+n,c.b+n];
  }
  for(var i=0;i<pos.count;i++){
    var x=pos.getX(i), z=pos.getZ(i);
    var h=terrainH(x,z);
    pos.setY(i,h);
    var rgb=bandColor(h,x,z);
    colors.push(rgb[0],rgb[1],rgb[2]);
  }
  terrGeo.setAttribute("color", new THREE.Float32BufferAttribute(colors,3));
  terrGeo.computeVertexNormals();
})();
var terrain = new THREE.Mesh(terrGeo, new THREE.MeshLambertMaterial({vertexColors:true}));
scene.add(terrain);

var water = new THREE.Mesh(
  new THREE.PlaneGeometry(1400,1400),
  new THREE.MeshLambertMaterial({color:"#16283f",transparent:true,opacity:0.93})
);
water.rotation.x=-Math.PI/2;
water.position.y=0;
scene.add(water);

function groundY(x,z){ return Math.max(terrainH(x,z),0); }
function P(x,z,extra){ return new THREE.Vector3(x, groundY(x,z)+2.2+(extra||0), z); }

/* ---------- 五稜郭（星形要塞） ---------- */
var FORT=[75,-70];
var fortGroup=new THREE.Group();
(function(){
  var baseY=groundY(FORT[0],FORT[1]);
  function starShape(R,r){
    var s=new THREE.Shape();
    for(var i=0;i<10;i++){
      var rad=(i%2===0)?R:r;
      var a=-Math.PI/2 + i*Math.PI/5;
      var px=Math.cos(a)*rad, py=Math.sin(a)*rad;
      if(i===0) s.moveTo(px,py); else s.lineTo(px,py);
    }
    s.closePath();
    return s;
  }
  var moat=new THREE.Mesh(
    new THREE.ShapeGeometry(starShape(14.5,8.2)),
    new THREE.MeshLambertMaterial({color:"#1d3147"})
  );
  moat.rotation.x=-Math.PI/2;
  moat.position.y=baseY+0.15;
  fortGroup.add(moat);
  var wall=new THREE.Mesh(
    new THREE.ExtrudeGeometry(starShape(11,6.2),{depth:2.4,bevelEnabled:false}),
    new THREE.MeshLambertMaterial({color:"#5e6e55"})
  );
  wall.rotation.x=-Math.PI/2;
  wall.position.y=baseY+0.2;
  fortGroup.add(wall);
  var hall=new THREE.Mesh(
    new THREE.BoxGeometry(4.6,1.6,3.2),
    new THREE.MeshLambertMaterial({color:"#8a7a5e"})
  );
  hall.position.set(0,baseY+3.4,0);
  fortGroup.add(hall);
  fortGroup.position.set(FORT[0],0,FORT[1]);
  scene.add(fortGroup);
})();

/* 弁天台場 */
(function(){
  var g=new THREE.Group();
  var fortb=new THREE.Mesh(
    new THREE.CylinderGeometry(4.5,5.2,2.2,6),
    new THREE.MeshLambertMaterial({color:"#6b6f62"})
  );
  fortb.position.y=1.0;
  g.add(fortb);
  g.position.set(60,0.2,-107);
  scene.add(g);
})();

/* ---------- 旗 ---------- */
function makeFlag(color,h){
  h=h||9;
  var g=new THREE.Group();
  var pole=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,h,6),
    new THREE.MeshLambertMaterial({color:"#3a352c"}));
  pole.position.y=h/2;
  g.add(pole);
  var cloth=new THREE.Mesh(new THREE.PlaneGeometry(5,3),
    new THREE.MeshLambertMaterial({color:color,side:THREE.DoubleSide}));
  cloth.position.set(2.6,h-1.8,0);
  g.add(cloth);
  g.userData.cloth=cloth;
  return g;
}
var fortBaseY=groundY(FORT[0],FORT[1])+2.6;
var fortFlagBlue=makeFlag("#4d7fb3",11);
fortFlagBlue.position.set(FORT[0],fortBaseY,FORT[1]);
fortFlagBlue.visible=false;
scene.add(fortFlagBlue);
var fortFlagWhite=makeFlag("#efece2",11);
fortFlagWhite.position.set(FORT[0],fortBaseY,FORT[1]);
fortFlagWhite.visible=false;
scene.add(fortFlagWhite);

/* ---------- 地名ラベル ---------- */
var LABELS=[
  ["五稜郭",   75, -70, 18, 1.05],
  ["函館山",   70,-128, 14, 0.95],
  ["弁天台場", 60,-107,  9, 0.8],
  ["一本木関門",64, -96,  8, 0.8],
  ["鷲ノ木",   15, 112,  9, 0.9],
  ["江差",   -138, -40,  9, 0.9],
  ["乙部",   -145,  -8,  9, 0.9],
  ["松前",   -110,-122,  9, 0.9],
  ["二股口",  -60, -52, 12, 0.85],
  ["木古内",  -45,-105,  8, 0.85]
];
/* カメラ近接時にラベルが画面を覆わないよう、近距離(LABEL_NEAR未満)では見かけサイズを一定に抑える */
var LABEL_NEAR=140;
var placeLabels=[], unitLabels=[];
var lblPos=new THREE.Vector3();
function fitLabels(){
  for(var a=0;a<2;a++){
    var arr=a===0?placeLabels:unitLabels;
    for(var i=0;i<arr.length;i++){
      var sp=arr[i];
      sp.getWorldPosition(lblPos);
      var f=Math.min(1,lblPos.distanceTo(camera.position)/LABEL_NEAR);
      sp.scale.set(sp.userData.bsX*f,sp.userData.bsY*f,1);
    }
  }
}
function makeLabel(text,scaleMul){
  var pad=14, fs=46;
  var c=document.createElement("canvas");
  var ctx=c.getContext("2d");
  ctx.font='500 '+fs+'px "Noto Serif JP", serif';
  var w=Math.ceil(ctx.measureText(text).width)+pad*2;
  c.width=w; c.height=fs+pad*2;
  ctx=c.getContext("2d");
  ctx.font='500 '+fs+'px "Noto Serif JP", serif';
  ctx.textBaseline="middle";
  ctx.lineWidth=8; ctx.strokeStyle="rgba(13,22,35,0.85)";
  ctx.strokeText(text,pad,c.height/2);
  ctx.fillStyle="#f3efe4";
  ctx.fillText(text,pad,c.height/2);
  var tex=new THREE.CanvasTexture(c);
  tex.minFilter=THREE.LinearFilter;
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  var s=(scaleMul||1)*13;
  sp.scale.set(s*(c.width/c.height), s, 1);
  sp.userData.bsX=s*(c.width/c.height);
  sp.userData.bsY=s;
  return sp;
}
function buildLabels(){
  LABELS.forEach(function(L){
    var sp=makeLabel(L[0],L[4]);
    sp.position.set(L[1], groundY(L[1],L[2])+L[3], L[2]);
    sp.renderOrder=10;
    placeLabels.push(sp);
    scene.add(sp);
  });
}
if(document.fonts && document.fonts.ready){
  var done=false;
  document.fonts.ready.then(function(){ if(!done){done=true;buildLabels();} });
  setTimeout(function(){ if(!done){done=true;buildLabels();} },2500);
}else buildLabels();

/* ---------- 部隊ラベル（指揮官・兵力） ---------- */
function makeUnitLabel(name,count,color){
  var fs1=40, fs2=27, pad=13;
  var c=document.createElement("canvas");
  var ctx=c.getContext("2d");
  ctx.font='700 '+fs1+'px "Noto Serif JP",serif';
  var w1=ctx.measureText(name).width;
  ctx.font='500 '+fs2+'px "Noto Serif JP",serif';
  var w2=count?ctx.measureText(count).width:0;
  var w=Math.ceil(Math.max(w1,w2))+pad*2+8;
  var h=count?(fs1+fs2+pad*2+8):(fs1+pad*2);

  ctx.fillRect(0,0,w,h);
  ctx.fillStyle=color;
  ctx.fillRect(0,0,7,h);
  ctx.font='700 '+fs1+'px "Noto Serif JP",serif';
  ctx.textBaseline="top";
  ctx.fillStyle="#f3efe4";
  ctx.fillText(name,pad+6,pad-3);
  if(count){
    ctx.font='500 '+fs2+'px "Noto Serif JP",serif';
    ctx.fillStyle="#d8cfb8";
    ctx.fillText(count,pad+6,pad+fs1+3);
  }
  var tex=new THREE.CanvasTexture(c);
  tex.minFilter=THREE.LinearFilter;
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));

var smokeTex=(function(){

function makeCombat(x,z,scale){
  scale=scale||1;
  var g=new THREE.Group();
  g.position.set(x,groundY(x,z),z);
  var ring=new THREE.Mesh(new THREE.RingGeometry(2.6*scale,3.3*scale,24),
    new THREE.MeshBasicMaterial({color:0xf2b25c,transparent:true,opacity:0.3,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2;
  ring.position.y=0.35;
  g.add(ring);
  var flashes=[];
  for(var i=0;i<4;i++){
    var f=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,color:0xffd070,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending,depthWrite:false}));
    f.scale.setScalar(2.6*scale);
    f.position.set((hash(i,x)-0.5)*5*scale,1.3,(hash(x,i)-0.5)*5*scale);
    g.add(f);
    flashes.push({sp:f,off:hash(i*3,z)*9});
  }
  var puffs=[];
  for(var j=0;j<6;j++){
    var p=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,color:0x9a9a9a,transparent:true,opacity:0,depthWrite:false}));
    p.position.set((hash(j,z)-0.5)*5*scale,1,(hash(z,j)-0.5)*5*scale);
    g.add(p);
    puffs.push({sp:p,off:hash(j*7,x)});
  }
  g.visible=false;
  return {obj:g, update:function(time,on){
    g.visible=on;
    if(!on)return;
    ring.material.opacity=0.22+0.14*Math.sin(time*5.5);
    flashes.forEach(function(f){ f.sp.visible=Math.sin(time*14+f.off*7)>0.45; });
    puffs.forEach(function(p){
      var u=(time*0.3+p.off)%1;
      p.sp.position.y=1+u*8*scale;
      p.sp.material.opacity=0.42*(1-u);
      p.sp.scale.setScalar((2+u*5.5)*scale);
    });
  }};
}

function makeFirefight(a,b,n){
  n=n||6;
  var g=new THREE.Group();
  var trs=[];
  for(var i=0;i<n;i++){
    var m=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.26,2.4),
      new THREE.MeshBasicMaterial({color:0xffe9b0,transparent:true,opacity:0.95}));
    m.visible=false;
    g.add(m);
    trs.push({m:m,off:hash(i,7)*1,rev:i%2===1,sp:1.5+hash(i,3)*0.9});
  }
  g.visible=false;
  var tmpA=new THREE.Vector3(), tmpB=new THREE.Vector3();
  return {obj:g, update:function(time,on){
    g.visible=on;
    if(!on)return;
    trs.forEach(function(tr){
      var u=(time*tr.sp+tr.off)%1;
      if(tr.rev){tmpA.copy(b);tmpB.copy(a);}else{tmpA.copy(a);tmpB.copy(b);}
      tr.m.position.lerpVectors(tmpA,tmpB,u);
      tr.m.position.y+=0.6+Math.sin(u*Math.PI)*1.4;
      tr.m.lookAt(tmpB);
      tr.m.visible=(u>0.05&&u<0.95);
    });
  }};
}

function makeExplosion(pos){
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,color:0xffb24a,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  sp.position.copy(pos);
  var smoke=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,color:0x555555,transparent:true,opacity:0,depthWrite:false}));
  smoke.position.copy(pos);
  var g=new THREE.Group();
  g.add(sp); g.add(smoke);
  return {obj:g, update:function(u){
    if(u<=0||u>=1){sp.material.opacity=0;smoke.material.opacity=0;return;}
    sp.material.opacity=Math.max(0,1-u*1.6);
    sp.scale.setScalar(3+u*26);
    smoke.material.opacity=0.5*(1-u);
    smoke.position.y=pos.y+u*14;
    smoke.scale.setScalar(4+u*18);
  }};
}

/* ---------- 部品ヘルパー ---------- */
var boxGeo=new THREE.BoxGeometry(1.7,1.7,1.7);

function makeArrow(pts,color,r){
  r=r||1.0;
  var curve=new THREE.CatmullRomCurve3(pts);
  var tube=new THREE.TubeGeometry(curve,72,r,6,false);
  var mat=new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0.92});
  var mesh=new THREE.Mesh(tube,mat);
  var total=tube.index.count;
  mesh.geometry.setDrawRange(0,0);
  var head=new THREE.Mesh(new THREE.ConeGeometry(r*2.6,r*6,8),mat);
  head.visible=false;
  var g=new THREE.Group();
  g.add(mesh); g.add(head);
  var up=new THREE.Vector3(0,1,0);
  return {obj:g, curve:curve, update:function(tt){
    tt=Math.max(0,Math.min(1,tt));
    mesh.geometry.setDrawRange(0,Math.floor(total*tt/3)*3);
    var q=Math.max(tt,0.002);
    head.position.copy(curve.getPointAt(q));
    head.quaternion.setFromUnitVectors(up,curve.getTangentAt(q));
    head.visible=tt>0.02;
  }};
}

function makeTroop(color,n,label,count){
  n=n||4;
  var g=new THREE.Group();
  var m=new THREE.MeshLambertMaterial({color:color});
  for(var i=0;i<n;i++){
    var b=new THREE.Mesh(boxGeo,m);
    b.position.set((i%2)*2.4-1.2, 0.9, Math.floor(i/2)*2.4-1.2);
    g.add(b);
  }
  var f=makeFlag(color,6);
  f.userData.cloth.scale.set(0.6,0.6,1);
  g.add(f);
  g.userData.mat=m;
  g.userData.flag=f;
  if(label){
    var sp=makeUnitLabel(label,count,color==="#4d7fb3"?"#6fa3d4":"#e06a4e");
    sp.position.set(0,11,0);
    g.add(sp);
    g.userData.label=sp;
  }
  return g;
}
function placeOn(group,curve,tt){
  tt=Math.max(0,Math.min(1,tt));
  var p=curve.getPointAt(tt);
  group.position.set(p.x,Math.max(groundY(p.x,p.z),0),p.z);
}

function makeShip(flagColor,hullColor,label,count){
  var g=new THREE.Group();

    new THREE.MeshLambertMaterial({color:"#3c4048"}));

  for(var i=0;i<2;i++){

      shells.push({m:sp,from:from,to:new THREE.Vector3(tg[0],groundY(tg[0],tg[1])+1,tg[1]),off:k*0.17});
    }
    var navalFF=makeFirefight(banryu.position.clone().setY(3),asahi.position.clone().setY(3),5);
    dyn.add(navalFF.obj);
    var boom=makeExplosion(asahi.position.clone().setY(3));
    dyn.add(boom.obj);
    var hij=makeTroop(HYO,2,"土方歳三","新選組副長");
    hij.position.set(64,groundY(64,-96),-96);
    dyn.add(hij);
    var cb1=makeCombat(60,-106,1);
    var cb2=makeCombat(64,-95,1.25);
    var cb3=makeCombat(70,-113,0.9);
    dyn.add(cb1.obj); dyn.add(cb2.obj); dyn.add(cb3.obj);
    var mid=new THREE.Vector3();
    var fell=false;
    updaters.push(function(t,time){
      a1.update(seg(t,0.06,0.5));
      a2.update(seg(t,0.42,0.78));
      placeOn(raid,a1.curve,seg(t,0.06,0.5));
      var st=seg(t,0.05,1);
      shells.forEach(function(s){
        var u=(st*2.4+s.off)%1;
        mid.lerpVectors(s.from,s.to,u);
        mid.y+=Math.sin(u*Math.PI)*16;
        s.m.position.copy(mid);
        s.m.visible=t>0.05;
      });
      navalFF.update(time, t>0.16&&t<0.5);
      boom.update(seg(t,0.5,0.62));
      var sink=seg(t,0.53,0.9);
      asahi.rotation.z=sink*0.7;
      asahi.position.y=-sink*4.5;
      cb3.update(time, t>0.14&&t<0.5);
      cb1.update(time, t>0.44&&t<0.98);
      cb2.update(time, t>0.55&&t<0.92);
      if(t>0.78&&!fell){
        fell=true;
        hij.userData.mat.color.set("#52555a");
        hij.userData.flag.userData.cloth.material.color.set("#52555a");
      }
      if(fell) hij.userData.flag.rotation.z=Math.min(1.25,hij.userData.flag.rotation.z+0.02);
    });
  }
},
{
  date:"明治2年（1869）5月18日",
  title:"五稜郭、開城",
  text:"千代ヶ岡が落ち、弁天台場も降伏。孤立した五稜郭は開城を決し、榎本武揚ら約千名が武装を解いた。鳥羽伏見にはじまる戊辰戦争、約一年半の戦いはこの星形の城郭で終わりを迎える。",
  textZ:"千代ヶ岡が落ちて、弁天台場も降伏。孤立した五稜郭はついに開城を決めて、榎本武揚たち約千名が武器を置いたのだ。鳥羽伏見から約一年半続いた戊辰戦争は、この星形のお城で終わったのだ。",
  mood:{bg:"#8d93a3",fog:0.0026},
  camA:{pos:[42,52,-108],look:[75,4,-70]},
  camB:{pos:[112,38,-34],look:[75,4,-70]},
  build:function(){
    fortFlagBlue.visible=true; fortFlagWhite.visible=true;
    fortFlagWhite.scale.y=0.05;
    var lb=makeUnitLabel("榎本武揚 ら 約1,000","武装解除・降伏","#6fa3d4");
    lb.position.set(FORT[0],groundY(FORT[0],FORT[1])+10,FORT[1]);
    dyn.add(lb);
    updaters.push(function(t){
      fortFlagBlue.scale.y=Math.max(0.05,1-seg(t,0.1,0.5));
      fortFlagBlue.visible=t<0.55;
      fortFlagWhite.scale.y=0.05+0.95*seg(t,0.45,0.8);
      lb.material.opacity=seg(t,0.5,0.75);
    });
  }
}
];

/* ---------- タイムライン制御 ---------- */
var cur=-1, phaseT=0, playing=true, finished=false;
var moodFog={d:0.0028};
var elDate=document.getElementById("ph-date"),
    elTitle=document.getElementById("ph-title"),
    elText=document.getElementById("ph-text"),
    elProg=document.querySelector("#progress i"),
    btnPlay=document.getElementById("btn-play"),
    dotsBox=document.getElementById("dots");

phases.forEach(function(p,i){
  var d=document.createElement("button");
  d.setAttribute("aria-label","局面"+(i+1)+"："+p.title);
  d.addEventListener("click",function(){ goto(i); });
  dotsBox.appendChild(d);
});
var dots=Array.prototype.slice.call(dotsBox.children);

function goto(i){
  cur=(i+phases.length)%phases.length;
  phaseT=0; finished=false;
  clearDyn();
  fortFlagBlue.scale.y=1; fortFlagWhite.scale.y=1;
  phases[cur].build();
  elDate.textContent=phases[cur].date;
  elTitle.textContent=phases[cur].title;
  elText.textContent=zMode ? phases[cur].textZ : phases[cur].text;
  dots.forEach(function(d,k){ d.setAttribute("aria-current", k===cur ? "true":"false"); });
  playVoice();
}

/* ---------- ずんだもんモード／音声 ----------
   音声ファイルの置き場所：このHTMLと同じ階層に voice/ フォルダを作り、
   VOICEVOX（話者：ずんだもん）で書き出したWAVを
   voice/phase1.wav 〜 voice/phase6.wav の名前で置くと再生される。
   ファイルが無い場合は何も起きない（エラーにならない）。 */
var zMode=false, voiceOn=false, audio=null;
function voiceSrc(i){ return "voice/phase"+(i+1)+".wav"; }
function stopVoice(){ if(audio){ audio.pause(); } }
function playVoice(){
  if(!voiceOn) return;
  /* Audio要素は初回トグル（タップ）時に1つだけ生成して使い回す。
     タップ起点で一度再生した要素はiOSでもアンロックされ、局面自動切替時のsrc差し替え再生が通る */
  if(!audio) audio=new Audio();
  audio.pause();
  audio.src=voiceSrc(cur);
  audio.play().catch(function(){ /* ファイル未配置・自動再生制限時は黙ってスキップ */ });
}
function updateCredit(){
  document.getElementById("credit").hidden=!(zMode||voiceOn);
}
var btnZunda=document.getElementById("btn-zunda");
btnZunda.addEventListener("click",function(){
  zMode=!zMode;
  btnZunda.textContent="ずんだもん解説："+(zMode?"ON":"OFF");
  btnZunda.setAttribute("aria-pressed",zMode?"true":"false");
  elText.textContent=zMode ? phases[cur].textZ : phases[cur].text;
  updateCredit();
});
var btnVoice=document.getElementById("btn-voice");
btnVoice.addEventListener("click",function(){
  voiceOn=!voiceOn;
  btnVoice.textContent="音声："+(voiceOn?"ON":"OFF");
  btnVoice.setAttribute("aria-pressed",voiceOn?"true":"false");
  updateCredit();
  if(voiceOn) playVoice(); else stopVoice();
});

function setPlaying(v){
  playing=v;
  btnPlay.textContent=playing?"一時停止":"再生";
  if(audio && voiceOn){ if(playing) audio.play().catch(function(){}); else audio.pause(); }
}
document.getElementById("btn-prev").addEventListener("click",function(){ goto(cur-1); });
document.getElementById("btn-next").addEventListener("click",function(){ goto(cur+1); });
var panel=document.getElementById("panel");
var btnFold=document.getElementById("btn-fold");
btnFold.addEventListener("click",function(){
  var min=panel.classList.toggle("min");
  btnFold.textContent=min?"ひらく":"たたむ";
  btnFold.setAttribute("aria-expanded",min?"false":"true");
});
panel.addEventListener("click",function(e){
  if(panel.classList.contains("min") && e.target!==btnFold) btnFold.click();
});
btnPlay.addEventListener("click",function(){
  if(finished){ goto(0); setPlaying(true); return; }
  setPlaying(!playing);
});
window.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight") goto(cur+1);
  else if(e.key==="ArrowLeft") goto(cur-1);
  else if(e.key===" "){ e.preventDefault(); btnPlay.click(); }
});

goto(0);

/* ---------- メインループ ---------- */
var vA=new THREE.Vector3(), vB=new THREE.Vector3(),
    wantPos=new THREE.Vector3(), wantLook=new THREE.Vector3(),
    bgTarget=new THREE.Color();
var clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  var dt=Math.min(clock.getDelta(),0.05);
  var ph=phases[cur];

  if(playing && !finished){
    phaseT+=dt/DUR;
    if(phaseT>=1){
      if(cur<phases.length-1){ goto(cur+1); }
      else { phaseT=1; finished=true; setPlaying(false); btnPlay.textContent="もう一度"; }
      ph=phases[cur];
    }
  }
  var t=Math.min(phaseT,1);
  var te=ease(t);
  var time=clock.elapsedTime;

  vA.fromArray(ph.camA.pos); vB.fromArray(ph.camB.pos);
  wantPos.lerpVectors(vA,vB,te);
  vA.fromArray(ph.camA.look); vB.fromArray(ph.camB.look);
  wantLook.lerpVectors(vA,vB,te);
  if(!REDUCED){
    wantPos.x+=Math.sin(time*0.21)*2.2;
    wantPos.y+=Math.sin(time*0.16)*1.4;
  }
  var k=1-Math.pow(0.0015,dt);
  camPos.lerp(wantPos,k);
  camLook.lerp(wantLook,k);
  camera.position.copy(camPos);
  camera.lookAt(camLook);

  bgTarget.set(ph.mood.bg);
  scene.background.lerp(bgTarget,k*0.6);
  scene.fog.color.copy(scene.background);
  moodFog.d+=(ph.mood.fog-moodFog.d)*k*0.6;
  scene.fog.density=moodFog.d;

  for(var i=0;i<updaters.length;i++) updaters[i](t,time);
  fitLabels();

  elProg.style.width=(t*100).toFixed(1)+"%";
  renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",function(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

})();
</script>
